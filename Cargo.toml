[package]
name = "nemorous"
version = "0.10.21"
edition = "2024"
description = "Nemorous native multi-repo Git client and code review workspace (NSH Rust)"
license = "MIT"
publish = false

[lib]
name = "nemorous"
path = "src/lib.rs"

[[bin]]
name = "nemorous"
path = "src/main.rs"

[[test]]
name = "native_macos_window"
path = "tests/native_macos_window.rs"
harness = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
env_logger = "0.11"
imara-diff = "0.2"
log = "0.4"
notify = "8.2"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
vt100 = "0.16"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync"] }
unicode-segmentation = "1.13"

nsh-core = { path = "build/nsh-v0.6.1/crates/nsh-core", features = ["svg"] }
nsh-base = { path = "build/nsh-v0.6.1/crates/nsh-base", default-features = false, features = ["editor", "highlight"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
portable-pty = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
nsh-platform-macos = { path = "build/nsh-v0.6.1/crates/nsh-platform-macos", default-features = false, features = ["editor", "highlight", "svg"] }

[dev-dependencies]
nsh-engine = { path = "build/nsh-v0.6.1/crates/nsh-engine", default-features = false }
nsh-testing = { path = "build/nsh-v0.6.1/crates/nsh-testing", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.two-face]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 2
strip = true
debug = false
