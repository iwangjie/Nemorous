name: Bug report
description: Report a reproducible problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, private repository names or production screenshots."
  - type: input
    id: version
    attributes:
      label: Version
      description: Nemorous version and platform.
      placeholder: "0.10.0, macOS arm64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal steps using a demo workspace.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include logs with secrets removed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, OS, architecture, Git version, LSP/AI setup.
