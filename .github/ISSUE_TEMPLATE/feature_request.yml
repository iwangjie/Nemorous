name: Feature request
description: Propose a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Existing tools or workflows you tried.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which platforms, plugins or Git operations are involved?
