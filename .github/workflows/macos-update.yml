name: Verify project tree fix
run-name: Verify Nemorous v0.10.29 project tree fix

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    if: github.ref == 'refs/heads/codex/verify-macos-project-tree' && inputs.version == '0.10.29'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust and NSH
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          scripts/prepare-nsh.sh
      - name: Configure Git for tests
        run: |
          git config --global user.name 'Nemorous CI'
          git config --global user.email 'ci@nemorous.dev'
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Repeat the project tree regression on macOS 15
        run: |
          set -euo pipefail
          cargo +1.99.0 test --locked --release --test headless_review_ui_tests \
            ui_project_tree_ignores_superseded_region_updates -- --exact --nocapture
          for ((trial = 1; trial <= 20; trial++)); do
            printf '\n--- Project tree trial %d/20 ---\n' "$trial"
            cargo +1.99.0 test --locked --release --test headless_review_ui_tests \
              ui_project_tree_real_fs_nested_repos_and_shortcuts -- --exact --nocapture
          done
      - name: Test Rust and headless UI
        run: cargo +1.99.0 test --locked --release --lib --test domain_git_tests --test headless_review_ui_tests
      - name: Build and validate the macOS bundle
        run: |
          cargo +1.99.0 build --locked --release --bin nemorous
          scripts/package-macos-app.sh "$RUNNER_TEMP/nemorous-ci" target/release/nemorous

  portable-core:
    if: github.ref == 'refs/heads/codex/verify-macos-project-tree' && inputs.version == '0.10.29'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust core
        shell: bash
        run: |
          git config --global core.autocrlf false
          rustup toolchain install 1.99.0 --profile minimal
          scripts/prepare-nsh.sh
          cargo +1.99.0 check --locked --lib
