name: Diagnose project tree on macOS 15
run-name: Diagnose Nemorous v0.10.29 project tree on macOS 15

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to diagnose
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose-project-tree:
    if: github.ref == 'refs/heads/codex/diagnose-macos-project-tree' && inputs.version == '0.10.29'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify baseline and prepare Rust and NSH
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3073638bd9242450faa41c6600282a1a1923e720
          sw_vers
          uname -m
          git --version
          rustup toolchain install 1.99.0 --profile minimal
          scripts/prepare-nsh.sh
      - name: Configure Git for tests
        run: |
          git config --global user.name 'Nemorous CI'
          git config --global user.email 'ci@nemorous.dev'
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Run only the project-tree test with tracing
        run: |
          set -euo pipefail
          for ((trial = 1; trial <= 20; trial++)); do
            printf '\n--- Project tree trial %d/20 ---\n' "$trial"
            cargo +1.99.0 test --locked --release --test headless_review_ui_tests \
              ui_project_tree_real_fs_nested_repos_and_shortcuts -- --exact --nocapture
          done
