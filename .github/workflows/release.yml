name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64,darwin/amd64
            artifacts: |
              build/**/*.dmg
              build/**/*.tar.gz
              build/**/update-*.json
          - os: windows-latest
            platform: windows/amd64
            artifacts: |
              build/**/*-setup-*.exe
              build/**/*.tar.gz
              build/**/update-*.json
          - os: windows-latest
            platform: windows/arm64
            artifacts: |
              build/**/*-setup-*.exe
              build/**/*.tar.gz
              build/**/update-*.json
          - os: ubuntu-24.04
            platform: linux/amd64
            artifacts: |
              build/**/*.deb
              build/**/*.tar.gz
              build/**/update-*.json
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifacts: |
              build/**/*.deb
              build/**/*.tar.gz
              build/**/update-*.json

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Stamp tag version into mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: go run ./scripts/setversion "${GITHUB_REF_NAME}"

      - name: Verify update signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY is missing; signed update manifests cannot be built"
            exit 1
          fi

      - name: Configure git for tests
        run: |
          git config --global user.name "Nemorous CI"
          git config --global user.email "ci@nemorous.dev"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Install nsis (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Vet and Test
        env:
          CGO_ENABLED: "0"
        run: |
          go tool mygo vet .
          go vet ./...
          go test ./...

      - name: Build signed release packages
        run: go tool mygo build -platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten release assets
        run: |
          mkdir release-assets
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [ -e "release-assets/$base" ]; then
              echo "::error::duplicate release asset: $base"
              exit 1
            fi
            cp "$file" "release-assets/$base"
          done

      - name: Write checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Build release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 == "## " ver { found=1; next }
            found && /^##[[:space:]]/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section.md
          {
            echo "## 变更记录"
            echo
            if [ -s /tmp/changelog-section.md ]; then
              cat /tmp/changelog-section.md
            else
              echo "详见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。"
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Nemorous ${GITHUB_REF_NAME}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" release-assets/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "$title" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" release-assets/* \
              --title "$title" --generate-notes --notes "$(cat release-notes.md)"
          fi
