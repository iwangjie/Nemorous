name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64,darwin/amd64
            artifacts: |
              build/**/*.dmg
              build/**/*.tar.gz
              build/**/update-*.json
          - os: windows-latest
            platform: windows/amd64
            artifacts: |
              build/**/*-setup-*.exe
              build/**/*.tar.gz
              build/**/update-*.json
          - os: windows-latest
            platform: windows/arm64
            artifacts: |
              build/**/*-setup-*.exe
              build/**/*.tar.gz
              build/**/update-*.json
          - os: ubuntu-24.04
            platform: linux/amd64
            artifacts: |
              build/**/*.deb
              build/**/*.tar.gz
              build/**/update-*.json
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifacts: |
              build/**/*.deb
              build/**/*.tar.gz
              build/**/update-*.json

    runs-on: ${{ matrix.os }}
    env:
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Stamp tag version into mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: go run ./scripts/setversion "${GITHUB_REF_NAME}"

      - name: Verify update signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY is missing; signed update manifests cannot be built"
            exit 1
          fi

      - name: Install nsis (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Vet and Test
        env:
          CGO_ENABLED: "0"
        run: |
          go tool mygo vet .
          go test ./...

      - name: Build signed release packages
        run: go tool mygo build -platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes
          fi
