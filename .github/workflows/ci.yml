name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure git for tests
        run: |
          git config --global user.name "Nemorous CI"
          git config --global user.email "ci@nemorous.dev"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run MyGo static lifetime vet
        run: go tool mygo vet .

      - name: Vet all packages
        run: go vet ./...

      - name: Run unit and headless UI tests
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Run backend race tests
        if: runner.os == 'Linux'
        run: go test -race ./internal/... -count=1

      - name: Build native package
        run: go tool mygo build
