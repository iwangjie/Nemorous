name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Rust and NSH
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          scripts/prepare-nsh.sh
      - name: Configure Git for tests
        run: |
          git config --global user.name 'Nemorous CI'
          git config --global user.email 'ci@nemorous.dev'
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Test Rust core and Git domain
        run: cargo +1.99.0 test --locked --release --lib --test domain_git_tests
      - name: Test headless UI
        env:
          RUST_TOOLCHAIN: '1.99.0'
        run: scripts/run-headless-ui-tests.sh
      - name: Build and validate the macOS bundle
        run: |
          cargo +1.99.0 build --locked --release --bin nemorous
          scripts/package-macos-app.sh "$RUNNER_TEMP/nemorous-ci" target/release/nemorous

  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Check Rust core
        shell: bash
        run: |
          git config --global core.autocrlf false
          rustup toolchain install 1.99.0 --profile minimal
          scripts/prepare-nsh.sh
          cargo +1.99.0 check --locked --lib
